<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1523"/>
      <stop offset="100%" stop-color="#04080f"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(112, 217, 210, 0.25)" stroke-width="6"/>

  <!-- Glowing background ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="12" opacity="0.35" filter="url(#glow)"/>

  <!-- Main Center Emblem: Stylized Shield with Lightning & Indian UPI / Apple Spark -->
  <g transform="translate(136, 126)">
    <!-- Outer Shield Shape -->
    <path d="M120 20 L220 60 C220 180 120 230 120 230 C120 230 20 180 20 60 Z" 
          fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.25"/>
    <path d="M120 24 L214 62 C214 174 120 220 120 220 C120 220 26 174 26 62 Z" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Central Lightning Bolt / Fast Automation Symbol -->
    <polygon points="135,50 85,130 125,130 105,210 165,115 125,115" 
             fill="#ffffff" filter="url(#glow)"/>
    <polygon points="135,50 85,130 125,130 105,210 165,115 125,115" 
             fill="url(#accentGrad)" opacity="0.85"/>
  </g>

  <!-- Tricolor Accent Dots at top-right -->
  <circle cx="390" cy="110" r="10" fill="#FF9933"/>
  <circle cx="414" cy="110" r="10" fill="#FFFFFF"/>
  <circle cx="438" cy="110" r="10" fill="#138808"/>
</svg>
