<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>와갈매크로</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <header><div class="brand"><img src="icon128.png" width="26" height="26" alt=""><h1 data-i18n="name">와갈매크로</h1><span id="environment" class="pill" hidden data-i18n="testMode">테스트</span></div><span id="version">0.4.0</span></header>
  <nav role="tablist" aria-label="Menu"><button id="run-tab" type="button" role="tab" aria-selected="true" aria-controls="run-pane" data-i18n="run">실행</button><button id="log-tab" type="button" role="tab" aria-selected="false" aria-controls="log-pane" tabindex="-1" data-i18n="logs">로그</button><button id="settings-tab" type="button" role="tab" aria-selected="false" aria-controls="settings-pane" tabindex="-1" data-i18n="settings">설정</button></nav>
  <div id="run-pane" role="tabpanel" aria-labelledby="run-tab">
    <section class="card target"><div class="target-top"><h2 id="product" data-i18n="emptyProduct">구독 화면을 점검하세요</h2><span id="connection" class="pill" data-i18n="checking">확인 중</span></div><p id="price" class="muted" data-i18n="emptyPrice">YouTube 구독 상세 화면에서 점검</p><div class="row"><button id="open" class="secondary" data-i18n="open">Apple 열기 ↗</button><button id="check" class="secondary" data-i18n="check">화면 점검</button></div></section>
    <section id="inspection" class="card" hidden><h2 id="inspection-title"></h2><p id="inspection-detail" class="muted"></p></section>
    <section id="setup" class="card" hidden><div class="fields"><label><span data-i18n="attempts">최대 횟수</span><input id="attempts" type="number" min="0" max="500" step="1" value="5"></label><label><span data-i18n="delay">간격 (초)</span><input id="delay" type="number" min="5" max="300" value="30"></label></div><p class="muted" data-i18n="attemptHint">0 = 횟수 무제한 · 시간 제한 적용</p><label class="consent"><input id="consent" type="checkbox"><span data-i18n="consent">표시된 금액으로 유료 갱신 시도에 동의</span></label><button id="start" class="primary" disabled data-i18n="checkFirst">점검 후 시작</button></section>
    <section class="card" id="progress" hidden><div class="metric"><strong id="count">0</strong><span id="cap"></span><span id="phase" class="pill"></span><time id="elapsed">00:00</time></div><p id="message" role="status" aria-live="polite"></p><p id="countdown" class="muted" hidden></p><button id="stop" class="stop" data-i18n="stop">중지</button><button id="recheck" class="secondary full" hidden data-i18n="recheck">다시 점검</button><button id="reload" class="secondary full" hidden data-i18n="reload">페이지 새로고침</button></section>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
  </div>
  <div id="log-pane" role="tabpanel" aria-labelledby="log-tab" hidden><div class="log-header"><h2 data-i18n="history">진행 이력</h2><button id="export" class="text-button" type="button" data-i18n="export">내려받기 ↓</button></div><p id="empty-logs" class="muted" data-i18n="emptyLogs">기록 없음</p><ol id="logs"></ol></div>
  <div id="settings-pane" role="tabpanel" aria-labelledby="settings-tab" hidden><section class="card settings"><label for="language" data-i18n="language">표시 언어</label><select id="language"><option value="ko">한국어</option><option value="en">English</option></select><label for="jitter" data-i18n="jitter">랜덤 간격 (±초)</label><input id="jitter" type="number" min="0" max="60" step="1" value="5"><p class="muted" data-i18n="jitterHint">기본 30±5초 · 최소 5초 · 0이면 고정</p><label for="minutes" data-i18n="minutes">시간 제한 (분)</label><input id="minutes" type="number" min="1" max="120" value="10"><p id="settings-note" class="muted" data-i18n="settingsNote">언어는 자동 저장됩니다.</p><span id="saved" role="status" aria-live="polite"></span></section><section class="card"><button id="open-test" class="secondary full" data-i18n="openTest">테스트 페이지 열기</button><p class="muted" data-i18n="testHelp">start-test.cmd를 먼저 실행하세요. 실제 결제는 없습니다.</p></section></div>
</main><script src="target.js"></script><script src="i18n.js"></script><script src="popup.js"></script></body></html>
